name: Проверки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://demo:demo@localhost:54835/asksql
      ANALYTICS_A_URL: postgresql://report_a:demo-a@localhost:54935/analytics
      ANALYTICS_B_URL: postgresql://report_b:demo-b@localhost:54935/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: docker compose up --build -d
      - run: |
          for attempt in $(seq 1 60); do
            curl -fsS -H 'X-API-Key: demo-a-key' http://localhost:8095/health && break
            sleep 2
          done
          uv run pytest -q
          uv run python -m scripts.evaluate
      - if: always()
        run: docker compose down
