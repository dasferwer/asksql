name: Проверки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://demo:demo@localhost:54835/asksql
      ANALYTICS_A_URL: postgresql://report_a:demo-a@localhost:54935/analytics
      ANALYTICS_B_URL: postgresql://report_b:demo-b@localhost:54935/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: docker compose up --build -d
      - run: |
          for attempt in $(seq 1 60); do
            curl -fsS -H 'X-API-Key: demo-a-key' http://localhost:8095/health && break
            sleep 2
          done
          uv run pytest -q
          uv run python -m scripts.evaluate
      - name: Проверка настоящей локальной модели
        env:
          MODEL_MODE: ollama
          OLLAMA_URL: http://ollama:11434
          EVAL_OUTPUT: llm-evaluation.json
        run: |
          docker compose --profile llm up -d ollama
          docker compose exec -T ollama ollama pull qwen2.5-coder:1.5b
          docker compose up -d api
          uv run python -m scripts.evaluate_llm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-evaluation
          path: llm-evaluation.json
      - if: always()
        run: docker compose --profile llm down
